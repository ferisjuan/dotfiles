
[env]
TERM = "xterm-256color"

[window]
padding = { x = 4, y = 4 }
dynamic_padding = true
decorations = "Transparent"
opacity = 0.90
blur = true
dynamic_title = true
startup_mode = "Maximized"

[scrolling]
history = 10000

[font]
size = 18.0

[font.normal]
family = "CaskaydiaCove Nerd Font Mono"
style = "Regular"

[font.bold]
family = "CaskaydiaCove Nerd Font Mono"
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font Mono"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = false

[terminal]
shell = { program = "/opt/homebrew/bin/herdr", args = ["--session", "main"] }

# Keybindings
[keyboard]
bindings = [{ key = "W", mods = "Command", action = "Quit" }]

# Tokyo Night theme
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.selection]
text = "#c0caf5"
background = "#33467c"

[colors.cursor]
text = "#15161e"
cursor = "#c0caf5"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"

[general]
import = []
